<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOURTV - Movie Player</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        :root {
            --bg: #060609; --surface: #0d0d14; --surface2: #13131f; --surface3: #1a1a2c;
            --accent: #e50914; --gold: #f5c518; --text: #e8e8ec; --text2: #a0a0b8;
            --text3: #6b6b80; --border: #1e1e32; --radius: 14px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
        .header{background:rgba(13,13,22,0.95);padding:14px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
        .brand{display:flex;align-items:center;gap:8px}
        .logo-icon{width:38px;height:38px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
        .brand h1{font-size:20px;color:#fff}
        .brand h1 span{color:var(--accent)}
        .home-btn{width:36px;height:36px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;text-decoration:none}
        .back-link{margin-left:auto;color:var(--text2);text-decoration:none}
        .player-container{flex:1;max-width:1300px;width:100%;margin:0 auto}
        .video-wrapper{background:#000;display:flex;justify-content:center}
        video{width:100%;max-height:70vh;background:#000;outline:none}
        .controls-bar{padding:14px 20px;background:var(--surface);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
        .qbtn{background:var(--surface3);color:#fff;padding:7px 15px;border-radius:50px;cursor:pointer;font-size:12px;border:2px solid transparent;transition:0.2s}
        .qbtn:hover,.qbtn.active{background:var(--accent);border-color:var(--accent)}
        .dash-btn{background:#5b3ec4}
        .mp4-btn{background:#1a5c7a}
        .dlbtn{background:#0d8a3e;font-weight:bold;margin-left:auto}
        .movie-details{padding:22px 26px;background:linear-gradient(180deg,var(--surface),#000);display:flex;gap:20px}
        .detail-poster{width:130px;height:195px;border-radius:var(--radius);object-fit:cover}
        .detail-title{font-size:26px;font-weight:800}
        .detail-meta{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
        .detail-description{font-size:13px;color:var(--text2);max-width:700px}
        .error-container{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <div class="logo-icon">🎬</div>
            <h1><span>YOUR</span>TV</h1>
        </div>
        <a href="/" class="home-btn" title="Home">🏠</a>
        <a href="movie.html" class="back-link">← Back to Movies</a>
    </header>

    <div class="player-container" id="playerContainer">
        <div class="error-container">Loading...</div>
    </div>

    <script>
        const API = '';  // same origin
        let movie = null, dashPlayer = null, allStreams = [], activeBtn = null;

        function getParams() {
            const p = new URLSearchParams(window.location.search);
            return { subject_id: p.get('subject_id'), slug: p.get('slug') || '' };
        }

        async function loadMovie() {
            const { subject_id, slug } = getParams();
            if (!subject_id) {
                showError('No movie specified.');
                return;
            }
            try {
                const res = await fetch(`${API}/api/stream/${subject_id}?detail_path=${encodeURIComponent(slug)}&se=0&ep=0`);
                if (!res.ok) throw new Error('API error ' + res.status);
                const data = await res.json();

                // Redirect if TV series
                if (data.is_series) {
                    window.location.href = `tvshow.html?subject_id=${encodeURIComponent(subject_id)}&slug=${encodeURIComponent(slug)}`;
                    return;
                }

                buildPlayerUI(data);
            } catch (e) {
                showError('Failed to load movie: ' + e.message);
            }
        }

        function buildPlayerUI(data) {
            const container = document.getElementById('playerContainer');
            container.innerHTML = `
                <div class="video-wrapper">
                    <video id="video" controls autoplay playsinline></video>
                </div>
                <div class="controls-bar" id="controls"></div>
                <div class="movie-details" id="details"></div>
            `;

            // Extract streams
            allStreams = [];
            // Add DASH streams
            (data.dash || []).forEach(d => {
                if (d.url) allStreams.push({ type: 'dash', url: d.url, label: 'DASH ' + (d.resolutions || 'Auto'), res: d.resolutions || 'Auto' });
            });
            // Add MP4 streams (skip empty URLs)
            (data.sources || []).forEach(s => {
                if (s.url) allStreams.push({ type: 'mp4', url: s.url, label: 'MP4 ' + (s.resolution || s.resolutions || '?'), res: s.resolution || s.resolutions || '?' });
            });

            if (allStreams.length === 0) {
                showError('No playable streams found.');
                return;
            }

            // Sort: dash first, then mp4 by resolution
            allStreams.sort((a, b) => {
                if (a.type === 'dash' && b.type !== 'dash') return -1;
                if (a.type !== 'dash' && b.type === 'dash') return 1;
                return (getResValue(b.res) - getResValue(a.res));
            });

            // Build buttons
            const controls = document.getElementById('controls');
            allStreams.forEach((s, i) => {
                const btn = document.createElement('button');
                btn.className = 'qbtn ' + (s.type === 'dash' ? 'dash-btn' : 'mp4-btn');
                btn.textContent = s.label;
                btn.onclick = () => selectStream(i, btn);
                controls.appendChild(btn);
            });

            // Download button
            const dlBtn = document.createElement('button');
            dlBtn.className = 'qbtn dlbtn';
            dlBtn.textContent = '⬇ Download';
            dlBtn.onclick = () => downloadMovie();
            controls.appendChild(dlBtn);

            // Show details
            const details = document.getElementById('details');
            const title = data.title || movie?.name || 'Unknown';
            const year = data.year || '';
            const rating = data.rating || '';
            const desc = data.description || '';
            const poster = data.poster_url || '';
            details.innerHTML = `
                ${poster ? `<img src="${poster}" class="detail-poster" onerror="this.style.display='none'">` : ''}
                <div>
                    <h2 class="detail-title">${title}</h2>
                    <div class="detail-meta">
                        ${year ? `<span>📅 ${year}</span>` : ''}
                        ${rating ? `<span>⭐ ${rating}</span>` : ''}
                    </div>
                    ${desc ? `<p class="detail-description">${desc}</p>` : ''}
                </div>
            `;

            // Auto-play first stream (prefer dash)
            selectStream(0, controls.querySelector('.qbtn'));
        }

        function getResValue(res) {
            if (!res) return 0;
            const s = String(res).toLowerCase();
            if (s.includes('2160') || s.includes('4k')) return 2160;
            if (s.includes('1080')) return 1080;
            if (s.includes('720')) return 720;
            if (s.includes('480')) return 480;
            if (s.includes('360')) return 360;
            return 0;
        }

        function selectStream(index, btn) {
            if (activeBtn) activeBtn.classList.remove('active');
            if (btn) { btn.classList.add('active'); activeBtn = btn; }
            const stream = allStreams[index];
            if (!stream) return;
            const video = document.getElementById('video');
            if (stream.type === 'dash') {
                if (dashPlayer) { try { dashPlayer.destroy(); } catch(e){} dashPlayer = null; }
                try {
                    dashPlayer = dashjs.MediaPlayer().create();
                    dashPlayer.initialize(video, stream.url, true);
                    dashPlayer.setAutoPlay(true);
                } catch (e) {
                    video.src = stream.url; video.load(); video.play().catch(()=>{});
                }
            } else {
                if (dashPlayer) { try { dashPlayer.destroy(); } catch(e){} dashPlayer = null; }
                video.src = stream.url; video.load(); video.play().catch(()=>{});
            }
        }

        function downloadMovie() {
            const { subject_id, slug } = getParams();
            const quality = prompt('Enter quality (360p, 480p, 720p, 1080p):', '480p');
            if (quality) {
                window.open(`${API}/download/${subject_id}?detail_path=${encodeURIComponent(slug)}&quality=${quality}&se=0&ep=0`, '_blank');
            }
        }

        function showError(msg) {
            document.getElementById('playerContainer').innerHTML = `
                <div class="error-container">
                    <div>
                        <h2 style="color:#fff;">Unable to load movie</h2>
                        <p style="color:#aaa;">${msg}</p>
                    </div>
                </div>`;
        }

        window.addEventListener('load', loadMovie);
    </script>
</body>
</html>
