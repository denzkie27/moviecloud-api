<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOURTV - Movie Player</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        /* ... your existing CSS ... */
        :root { ... } /* keep all CSS rules */
    </style>
</head>
<body>
    <header class="header">
        <div class="brand">
            <div class="logo-icon">🎬</div>
            <h1><span>YOUR</span>TV</h1>
        </div>
        <a href="/" class="home-btn" title="Go to YOURTV Home">
            <svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
        </a>
        <a href="movie.html" class="back-link">← Back to Movies</a>
    </header>

    <div class="player-container" id="playerContainer"></div>

    <script>
        const API = '';
        let movie = null, dashPlayer = null, allStreams = [], activeQBtn = null;

        function getParams() {
            const p = new URLSearchParams(window.location.search);
            return {
                subject_id: p.get('subject_id') || p.get('id'),
                slug: p.get('slug') || ''
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            const { subject_id, slug } = getParams();
            if (!subject_id) {
                showError('No movie specified. Please provide a subject_id or id in the URL.<br><a href="/" style="color:var(--accent);">Browse here</a>');
                return;
            }
            movie = { subject_id, slug, name: 'Loading...' };
            buildPlayerUI();
            fetchMovieAndStreams(subject_id, slug);
        });

        function showError(msg) {
            document.getElementById('playerContainer').innerHTML = `
                <div class="error-container">
                    <div>
                        <div class="icon">⚠️</div>
                        <h2 style="color:var(--text);margin-bottom:10px;">Unable to load movie</h2>
                        <p style="color:var(--text2);">${msg}</p>
                    </div>
                </div>`;
        }

        function buildPlayerUI() {
            document.getElementById('playerContainer').innerHTML = `
                <div class="video-wrapper"><video id="video" controls autoplay playsinline poster=""></video></div>
                <div class="controls-bar">
                    <span class="section-label">🎬 Quality</span>
                    <span class="note" id="formatNote">💡 Select DASH quality for best streaming</span>
                    <span id="qualityButtons" style="display:flex;gap:8px;flex-wrap:wrap;"></span>
                    <button class="qbtn dlbtn" onclick="downloadMovie()">⬇ Download</button>
                </div>
                <div class="movie-details" id="movieDetails">
                    <span class="no-details">Loading movie details...</span>
                </div>
            `;
        }

        async function fetchMovieAndStreams(sid, slug) {
            const qb = document.getElementById('qualityButtons');
            const md = document.getElementById('movieDetails');
            const note = document.getElementById('formatNote');

            try {
                const res = await fetch(`${API}/api/stream/${sid}?detail_path=${encodeURIComponent(slug)}&se=0&ep=0`);
                if (!res.ok) {
                    throw new Error(`API error ${res.status}`);
                }
                const data = await res.json();

                // If backend tells us it's a TV series, redirect to TV player
                if (data.is_series) {
                    window.location.href = `tvshow.html?subject_id=${encodeURIComponent(sid)}&slug=${encodeURIComponent(slug)}`;
                    return;
                }

                if (!data.has_resource && (data.sources?.length === 0 && data.dash?.length === 0)) {
                    // No streams and not a series? Show error
                    qb.innerHTML = '<span style="color:#e50914;">❌ No streams available</span>';
                    note.textContent = '⚠️ No playable sources found.';
                    md.innerHTML = '<span class="no-details">Could not fetch movie data.</span>';
                    return;
                }

                // Process streams
                allStreams = [];
                (data.dash || []).forEach(s => s && s.url && allStreams.push({ type:'dash', url:s.url, label:'🎬 DASH '+(s.resolutions||'Auto'), resolution:s.resolutions||'Auto' }));
                (data.sources || []).forEach(s => {
                    if(!s || !s.url) return;
                    const fmt = (s.format||'').toLowerCase(), url = s.url.toLowerCase();
                    if(fmt.includes('dash') || url.endsWith('.mpd')) return;
                    let label = '🎥 MP4';
                    if(fmt.includes('mpeg')||url.endsWith('.m3u8')) label='📡 HLS';
                    else if(fmt.includes('webm')) label='🌐 WebM';
                    allStreams.push({ type:'mp4', url:s.url, label:`${label} ${s.resolution||''}`.trim(), resolution:s.resolution||'?' });
                });
                if(data.dash_url && !allStreams.some(s=>s.url===data.dash_url)) allStreams.push({type:'dash', url:data.dash_url, label:'🎬 DASH (main)', resolution:'Auto'});
                if(data.manifest_url && !allStreams.some(s=>s.url===data.manifest_url)) allStreams.push({type:'dash', url:data.manifest_url, label:'🎬 DASH (manifest)', resolution:'Auto'});
                allStreams = allStreams.filter((v,i,a)=>a.findIndex(t=>t.url===v.url)===i);

                movie.name = data.title || data.name || movie.name;
                buildMovieDetails(data, movie);

                if(allStreams.length===0) {
                    qb.innerHTML = '<span style="color:#e50914;">❌ No streams available</span>';
                    note.textContent = '⚠️ No playable sources found.';
                    return;
                }

                allStreams.sort((a,b)=> (a.type==='dash'&&b.type!=='dash'?-1:(a.type!=='dash'&&b.type==='dash'?1:getResolutionRank(b.resolution)-getResolutionRank(a.resolution)) ));
                qb.innerHTML = '';
                allStreams.forEach((s,i)=>{
                    const btn = document.createElement('button');
                    btn.className = 'qbtn '+(s.type==='dash'?'dash-btn':'mp4-btn');
                    btn.textContent = s.label;
                    btn.title = s.type.toUpperCase()+': '+s.url;
                    btn.onclick = ()=> selectStream(i, btn);
                    qb.appendChild(btn);
                });

                const firstDash = allStreams.findIndex(s=>s.type==='dash');
                if(firstDash!==-1){
                    selectStream(firstDash, qb.querySelectorAll('.qbtn')[firstDash]);
                    note.textContent = '✨ Auto-selected DASH quality.';
                } else if(allStreams.length>0){
                    selectStream(0, qb.querySelector('.qbtn'));
                    note.textContent = '💡 No DASH – try another format.';
                }
            } catch (e) {
                console.error(e);
                qb.innerHTML = '<span style="color:#e50914;">❌ Failed to load streams</span>';
                note.textContent = '⚠️ ' + e.message;
                md.innerHTML = '<span class="no-details">Could not fetch movie data. The movie might not be available.</span>';
            }
        }

        // Helper: rank resolutions
        function getResolutionRank(res) { ... } // unchanged

        function selectStream(index, btn) { ... } // unchanged

        function buildMovieDetails(apiData, movieObj) { ... } // unchanged

        function downloadMovie() { ... } // unchanged

        window.addEventListener('beforeunload', ()=>{
            if(dashPlayer) try{dashPlayer.destroy()}catch(e){}
        });
    </script>
</body>
</html>
